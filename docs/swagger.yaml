        type: integer
      ketResto:
        type: string
      kota:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      namaResto:
        type: string
    type: object
  domain.TokoOlehOleh:
    properties:
      alamatBelanja:
        type: string
      createdAt:
        type: string
      foto:
        type: string
      id:
        type: integer
      jenisBelanja:
        type: string
      ketBelanja:
        type: string
      kota:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      namaBelanja:
        type: string
    type: object
  domain.Transportasi:
    properties:
      createdAt:
        type: string
      foto:
        type: string
      hargaTransportasiIDR:
        type: number
      id:
        type: integer
      jenisTransportasi:
        type: string
      ketTransportasi:
        type: string
      kodeBandara:
        type: string
      namaTransportasi:
        type: string
      rute:
        type: string
    type: object
  domain.Wisata:
    properties:
      alamatWisata:
        type: string
      createdAt:
        type: string
      foto:
        type: string
      id:
        type: integer
      kategoriWisata:
        type: string
      ketWisata:
        type: string
      kota:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      namaWisata:
        type: string
      tiketWisata:
        type: number
    type: object
  request.Login:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  response.Base:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  response.PlanData:
    properties:
      fasilitas_ibadah:
        items:
          $ref: '#/definitions/domain.FasilitasIbadah'
        type: array
      hotel:
        items:
          $ref: '#/definitions/domain.Hotel'
        type: array
      restoran:
        items:
          $ref: '#/definitions/domain.RestoranHalal'
        type: array
      toko_oleh_oleh:
        items:
          $ref: '#/definitions/domain.TokoOlehOleh'
        type: array
      wisata:
        items:
          $ref: '#/definitions/domain.Wisata'
        type: array
    type: object
